# Builds PathRenamer.exe and the installer on Windows and publishes them as a
# GitHub Release.
#
# The easy way: on GitHub open Actions > Release > "Run workflow" > Run.
# It reads the version from APP_VERSION in src/version.py, builds, and publishes
# release "V<version>" with RELEASE_NOTES.md as its text. A tag left behind by
# a deleted release is moved to the new build.
#
# Also works by pushing a tag (git tag V1.3.0 && git push origin V1.3.0) or by
# publishing a release on the website with a new tag: the installer is then
# attached to that release a few minutes later.
#
# On pull requests it only builds (the exe and installer are downloadable from
# the run's artifacts), so a broken build shows up before release.
#
# A published release also pushes the Docker image (the command line version)
# to ghcr.io/royalkiller2222/pathrenamer, tagged latest and with the version.
name: Release

on:
  push:
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (untick to only build a test installer)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-lock.txt pyinstaller==6.22.3 pytest==9.1.1

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          # Tags may be v1.3.0 or V1.3.0 (PowerShell compares case-insensitively)
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match APP_VERSION $v in src/version.py"
          }

      - name: Run tests
        run: python -m pytest -q

      # The app's own keys come from repository settings, never from the code:
      # Settings > Secrets and variables > Actions. Both are optional: without
      # OPENSUBTITLES_API_KEY users enter their own key; without
      # POLAR_ORGANIZATION_ID every Pro feature stays unlocked (early access).
      - name: Add the app's API keys
        shell: pwsh
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
          POLAR_PORTAL_URL: ${{ vars.POLAR_PORTAL_URL }}
        run: |
          $lines = @(
            "# Written by the release build. Not in git.",
            "OPENSUBTITLES_API_KEY = '$($env:OPENSUBTITLES_API_KEY -replace "'", '')'",
            "POLAR_ORGANIZATION_ID = '$($env:POLAR_ORGANIZATION_ID -replace "'", '')'",
            "POLAR_PORTAL_URL = '$($env:POLAR_PORTAL_URL -replace "'", '')'"
          )
          Set-Content -Path src/build_info.py -Value $lines -Encoding utf8

      - name: Build PathRenamer.exe
        working-directory: src
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name PathRenamer
          --icon newicon.ico --add-data "newicon.ico;."
          --collect-all guessit --collect-all rebulk --collect-all babelfish
          --hidden-import rapidfuzz --hidden-import rapidfuzz.fuzz
          --distpath ../dist main.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer/PathRenamer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PathRenamer-${{ steps.ver.outputs.version }}
          path: |
            dist/PathRenamer.exe
            dist/PathRenamer-Setup-*.exe

      - name: Publish release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $files = @("dist/PathRenamer-Setup-$env:VERSION.exe", "dist/PathRenamer.exe")
          $fromTag = $env:GITHUB_EVENT_NAME -eq "push"
          $tag = if ($fromTag) { $env:GITHUB_REF_NAME } else { "V$env:VERSION" }

          gh release view $tag --repo $repo *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $fromTag) {
            # Release made on the GitHub website: attach the installer to it
            gh release upload $tag @files --repo $repo --clobber
          } elseif ($exists) {
            throw ("Release $tag already exists. To publish a new version, raise APP_VERSION in " +
                   "src/version.py first, or delete release $tag on GitHub and run this again.")
          } else {
            if (-not $fromTag) {
              # A tag left behind by a deleted release: point it at this build
              $old = gh api "repos/$repo/git/ref/tags/$tag" --jq ".object.sha" 2>$null
              if ($LASTEXITCODE -eq 0 -and $old -and $old -ne $env:GITHUB_SHA) {
                Write-Host "Moving leftover tag $tag from $old to $env:GITHUB_SHA"
                gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Could not move tag $tag" }
              }
            }
            gh release create $tag @files --repo $repo --target $env:GITHUB_SHA `
              --title "Version $env:VERSION" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing release $tag failed" }
          Write-Host "Published: https://github.com/$repo/releases/tag/$tag"

  docker:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: echo "version=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' src/version.py)" >> "$GITHUB_OUTPUT"

      - name: Add the app's API keys
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
          POLAR_PORTAL_URL: ${{ vars.POLAR_PORTAL_URL }}
        run: |
          python3 - <<'PY'
          import os
          with open("src/build_info.py", "w", encoding="utf-8") as f:
              f.write("# Written by the release build. Not in git.\n")
              for name in ("OPENSUBTITLES_API_KEY", "POLAR_ORGANIZATION_ID", "POLAR_PORTAL_URL"):
                  value = (os.environ.get(name) or "").replace("\\", "").replace("'", "")
                  f.write(f"{name} = '{value}'\n")
          PY

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Intel/AMD servers and ARM boxes (Raspberry Pi, many NAS models)
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/royalkiller2222/pathrenamer:latest
            ghcr.io/royalkiller2222/pathrenamer:${{ steps.ver.outputs.version }}
