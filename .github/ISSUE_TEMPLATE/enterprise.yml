name: PathRenamer for teams and media servers
description: Tell us what you'd need from an Enterprise version (hosted metadata, server/NAS mode, many licenses).
title: "Enterprise: "
labels: ["enterprise"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest! This issue is public, so please don't include private details.
        We'll reply here.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: How many machines, which media server, and where it runs (Windows PC, NAS, Docker, server).
    validations:
      required: true
  - type: textarea
    id: needs
    attributes:
      label: What you'd need
      description: For example hosted metadata without API keys, a headless mode, licenses for a team, shared presets, support.
    validations:
      required: true
